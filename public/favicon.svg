<svg width="32" height="32" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Fondo redondeado -->
  <rect width="100" height="100" rx="16" fill="#1e40af"/>
  
  <!-- Techo/Casa -->
  <path
    d="M20 60 L50 30 L80 60"
    stroke="white"
    strokeWidth="3"
    fill="none"
    strokeLinecap="round"
    strokeLinejoin="round"
  />

  <!-- Paredes -->
  <rect x="25" y="60" width="50" height="25" stroke="white" strokeWidth="2" fill="none" />

  <!-- Puerta -->
  <rect x="45" y="70" width="10" height="15" stroke="white" strokeWidth="1.5" fill="none" />

  <!-- Puntos de la red -->
  <circle cx="50" cy="45" r="2.5" fill="white" />
  <circle cx="35" cy="55" r="2" fill="#e0e7ff" />
  <circle cx="65" cy="55" r="2" fill="#e0e7ff" />
  <circle cx="30" cy="70" r="2" fill="#e0e7ff" />
  <circle cx="70" cy="70" r="2" fill="#e0e7ff" />
  <circle cx="50" cy="75" r="2" fill="white" />

  <!-- Conexiones de la red -->
  <line x1="50" y1="45" x2="35" y2="55" stroke="white" strokeWidth="1" opacity="0.8" />
  <line x1="50" y1="45" x2="65" y2="55" stroke="white" strokeWidth="1" opacity="0.8" />
  <line x1="35" y1="55" x2="30" y2="70" stroke="white" strokeWidth="1" opacity="0.8" />
  <line x1="65" y1="55" x2="70" y2="70" stroke="white" strokeWidth="1" opacity="0.8" />
  <line x1="30" y1="70" x2="50" y2="75" stroke="white" strokeWidth="1" opacity="0.8" />
  <line x1="70" y1="70" x2="50" y2="75" stroke="white" strokeWidth="1" opacity="0.8" />
</svg>
